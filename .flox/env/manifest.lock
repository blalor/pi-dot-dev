    "hook": {
      "on-activate": "    export _PI_ROOT=\"${FLOX_ENV_PROJECT}\"\n\n    # do the base install\n    [ -d \"${_PI_ROOT}/node_modules\" ] || ( cd \"${_PI_ROOT}\" && npm install )\n\n    # Capture Pi configuration (settings, auth, extensions, skills,\n    # prompts, themes, installed-package declarations) in this repository.\n    export PI_CODING_AGENT_DIR=\"${_PI_ROOT}/agent-config\"\n\n    # Keep session transcripts out of this repository.\n    ## nope, that doesn't work\n    # export PI_CODING_AGENT_SESSION_DIR=\"${HOME}/.pi/agent/sessions\"\n\n    ln -sf \"${HOME}/.pi/agent/sessions/\" \"${PI_CODING_AGENT_DIR}/sessions\"\n    [ -d \"${HOME}/.pi/agent/sessions/\" ] || mkdir -p \"${HOME}/.pi/agent/sessions/\"\n\n    # do after setting PI_CODING_* vars but before PI_OFFLINE\n    if [ -e \"${FLOX_ENV_CACHE}/pi-did-update-extensions\" ]; then\n        node_modules/.bin/pi update --extensions\n        touch \"${FLOX_ENV_CACHE}/pi-did-update-extensions\"\n    fi\n\n    # disable all startup network operations described here, including update\n    # checks, package update checks, and install/update telemetry.\n    export PI_OFFLINE=1\n\n    # The Kagi search extension checks KAGI_SESSION_TOKEN before falling back\n    # to its hard-coded ~/.pi/kagi-search.json path. Load the token from this\n    # repository-local config when present.\n    if [ -z \"${KAGI_SESSION_TOKEN:-}\" ] && [ -f \"${PI_CODING_AGENT_DIR}/kagi-search.json\" ]; then\n        KAGI_SESSION_TOKEN=\"$( jq -e -r .sessionToken \"${PI_CODING_AGENT_DIR}/kagi-search.json\" )\"\n        export KAGI_SESSION_TOKEN\n    fi\n\n    export PATH=\"${_PI_ROOT}/bin:${PATH}\"\n"
    },
    "options": {
      "cuda-detection": false
    }
  },
