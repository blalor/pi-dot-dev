schema-version = "1.10.0"

[install]
nodejs.pkg-path = "nodejs"

[hook]
on-activate = '''
    export _PI_ROOT="${FLOX_ENV_PROJECT}"

    [ -d "${_PI_ROOT}/node_modules" ] || ( cd "${_PI_ROOT}" && npm install )

    # disable all startup network operations described here, including update
    # checks, package update checks, and install/update telemetry.
    export PI_OFFLINE=1

    export PATH="${_PI_ROOT}/bin:${PATH}"
    # export PI_PACKAGE_DIR="${FLOX_ENV_PROJECT}/node_modules/@mariozechner/pi-coding-agent"

    # mkdir -p "${PI_PACKAGE_DIR}"
    # echo '{}' >| "${PI_PACKAGE_DIR}/package.json"
'''

[options]
cuda-detection = false
